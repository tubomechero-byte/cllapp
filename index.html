<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Llamadas de voz</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>

<body>
  <main class="card">
    <h1>📞 Llamadas de voz</h1>
    <p class="subtitle">Usa un nombre de usuario para llamar.</p>

    <section id="login-panel">
      <label for="username-input">Tu nombre de usuario</label>
      <input
        id="username-input"
        type="text"
        maxlength="24"
        placeholder="Ejemplo: AXEN"
        autocomplete="off"
        spellcheck="false"
      >
      <p class="hint">Solo letras, números, guion y guion bajo.</p>
      <button id="start-btn" class="btn btn-call" type="button">
        Entrar
      </button>
    </section>

    <section id="app-panel" class="hidden">
      <section class="status-box">
        <p>Conectado como</p>
        <strong id="my-username"></strong>
      </section>

      <section class="input-group">
        <label for="peer-username-input">Usuario al que quieres llamar</label>
        <input
          type="text"
          id="peer-username-input"
          maxlength="24"
          placeholder="Ejemplo: ABUELO"
          autocomplete="off"
          spellcheck="false"
        >

        <button id="call-btn" class="btn btn-call" type="button" disabled>
          📞 Llamar
        </button>

        <button id="hangup-btn" class="btn btn-hangup" type="button" disabled>
          🔴 Colgar
        </button>
      </section>

      <p id="call-status" class="status-text">Listo para llamar.</p>
      <p class="small-note">
        La otra persona también debe tener la página abierta y estar conectada.
      </p>
    </section>

    <audio id="remote-audio" autoplay playsinline></audio>

    <div id="incoming-call" class="incoming-call hidden">
      <div class="incoming-box">
        <div class="incoming-icon">📞</div>
        <h2>Llamada entrante</h2>
        <p id="incoming-from"></p>

        <div class="incoming-buttons">
          <button id="answer-btn" class="btn btn-answer" type="button">
            ✅ Aceptar
          </button>
          <button id="reject-btn" class="btn btn-reject" type="button">
            ❌ Rechazar
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- Sonido de llamada -->
  <audio id="ringtone" preload="auto" loop>
    <source src="https://actions.google.com/sounds/v1/alarms/phone_alerts_and_rings.ogg" type="audio/ogg">
  </audio>

  <script src="app.js"></script>
</body>
</html>
